<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>见南山</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-wrap">
            <div class="logo-area">
                <div class="logo-block" id="logoBlock">
                    <img id="logoImage" src="" alt="Logo" style="width:100%;height:100%;object-fit:cover;display:none;">
                </div>
                <h1 class="logo-name" id="siteName">見南山</h1>
                <span class="logo-slogan" id="siteDesc">春山如黛草如烟</span>
            </div>
            <nav class="nav-list" id="globalNav">
                <a data-page="page-home" class="active">
                    <span class="nav-icon">🏠</span>
                    <span class="nav-text">首页</span>
                </a>
                <a data-page="page-xingyin">
                    <span class="nav-icon">📜</span>
                    <span class="nav-text">行吟册</span>
                </a>
                <a data-page="page-shinian">
                    <span class="nav-icon">📖</span>
                    <span class="nav-text">十年灯</span>
                </a>
                <a data-page="page-about">
                    <span class="nav-icon">🧑‍🌾</span>
                    <span class="nav-text">山野渔夫</span>
                </a>
            </nav>
        </div>
    </header>

    <main class="container" id="app">
        <!-- ===== 首页 ===== -->
        <section id="page-home" class="page-section active">
            <div class="home-row">
                <div class="home-left">
                    <h2 class="post-title" id="homeTitle">不再热爱生活。</h2>
                    <div class="post-date" id="homeDate">2026/09/07</div>
                    <span class="divider-line"></span>
                </div>
                <div class="center-image">
                    <div class="tilted-card" id="homeImage" style="background-color: #999999;"></div>
                </div>
                <div class="right-list" id="homeLatest"></div>
            </div>
        </section>

        <!-- ===== 行吟册 ===== -->
        <section id="page-xingyin" class="page-section">
            <div class="article-list" id="xingyinList"></div>
        </section>

        <!-- ===== 十年灯 ===== -->
        <section id="page-shinian" class="page-section">
            <div class="card-grid" id="shinianCards"></div>
        </section>

        <!-- ===== 十年灯 子列表 ===== -->
        <section id="shinian-list" class="page-section">
            <div class="article-list" id="shinianList"></div>
            <button class="back-btn" data-back="page-shinian">返回</button>
        </section>

        <!-- ===== 十年灯 详情 ===== -->
        <section id="shinian-detail" class="page-section">
            <div class="detail-grid">
                <div class="book-main">
                    <h2 class="title" id="shinianDetailTitle"></h2>
                    <div class="date" id="shinianDetailDate"></div>
                    <div class="book-content" id="shinianDetailContent"></div>
                    <button class="back-btn" data-back="shinian-list">返回</button>
                </div>
                <aside class="sidebar">
                    <h3 class="sidebar-title" id="shinianSidebarTitle">系列</h3>
                    <div class="sidebar-list" id="shinianSidebar"></div>
                </aside>
            </div>
        </section>
<!-- ===== 山野渔夫 ===== -->
<section id="page-about" class="page-section">
    <div class="about-text" id="aboutContent"></div>
    
    <!-- ★★★ 分割线 ★★★ -->
    <hr class="about-divider">
    
    <!-- ★★★ 站点信息卡片 ★★★ -->
    <div class="about-links">
        <p class="links-title">若能得您垂青，还望链接小站：</p>
        <div class="site-info">
            <div class="site-info-item">
                <span class="site-info-label">名称</span>
                <span class="site-info-value">見南山</span>
            </div>
            <div class="site-info-item">
                <span class="site-info-label">地址</span>
                <span class="site-info-value">********</span>
            </div>
            <div class="site-info-item">
                <span class="site-info-label">描述</span>
                <span class="site-info-value">********</span>
            </div>
        </div>
    </div>
    
    <div class="date-footer">2026/09/07</div>
</section>
</section>
    </main>

    <script src="supabase.js"></script>
    <script src="script.js"></script>
</body>
</html>
