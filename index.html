<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>须臾之间</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-wrap">
            <div class="logo-area">
                <h1 class="logo-name" id="siteName">须臾之间</h1>
                <span class="logo-slogan" id="siteDesc">寄蜉蝣于天地，渺沧海之一粟</span>
            </div>
            <nav class="nav-list" id="globalNav">
                <a data-page="page-home" class="active">
                    <span class="nav-text">序章</span>
                </a>
                <a data-page="page-xingyin">
                    <span class="nav-text">随笔</span>
                </a>
                <a data-page="page-shinian">
                    <span class="nav-text">杂记</span>
                </a>
                <a data-page="page-about">
                    <span class="nav-text">闲话</span>
                </a>
            </nav>
        </div>
    </header>

    <main class="container" id="app">
        <!-- ===== 首页（序章） ===== -->
        <section id="page-home" class="page-section active">
            <!-- Banner -->
            <div class="banner">
                <div class="banner-text" id="bannerText"></div>
                <button class="banner-btn" id="bannerBtn">去告诉她 <span class="btn-arrow">›</span></button>
            </div>

            <!-- 随笔区 -->
            <div class="essay-section">
                <div class="essay-grid" id="homeXingyin"></div>
            </div>

            <!-- 杂记区 -->
            <div class="note-section">
                <div class="note-left">
                    <h2 class="note-heading">杂记</h2>
                    <div class="note-desc" id="noteDesc">
                        没有宏大的主题<br>
                        也没有完整的叙事<br>
                        不足以称文章<br>
                        只用来证明<br>
                        我曾在此间停留
                    </div>
                </div>
                <div class="note-right" id="homeShinian"></div>
            </div>
        </section>

        <!-- ===== 随笔（行吟册） ===== -->
        <section id="page-xingyin" class="page-section">
            <div class="article-list" id="xingyinList"></div>
        </section>

        <!-- ===== 杂记（十年灯） ===== -->
        <section id="page-shinian" class="page-section">
            <div class="shinian-layout">
                <div class="shinian-main">
                    <div class="shinian-article-list" id="shinianArticleList"></div>
                </div>
                <aside class="shinian-sidebar">
                    <h3 class="shinian-sidebar-title">系列</h3>
                    <div class="shinian-series-list" id="shinianSeriesList"></div>
                </aside>
            </div>
        </section>

        <!-- ===== 杂记 详情 ===== -->
        <section id="shinian-detail" class="page-section">
            <div class="book-main">
                <h2 class="title" id="shinianDetailTitle"></h2>
                <div class="date" id="shinianDetailDate"></div>
                <div class="book-content" id="shinianDetailContent"></div>
                <button class="back-btn" data-back="page-shinian">返回</button>
            </div>
        </section>

        <!-- ===== 闲话（山野渔夫） ===== -->
        <section id="page-about" class="page-section">
            <div class="about-text" id="aboutContent"></div>
            <hr class="about-divider">
            <div class="about-links">
                <p class="links-title">若能得您垂青，还望链接小站：</p>
                <div class="site-info">
                    <div class="site-info-item">
                        <span class="site-info-label">名称</span>
                        <span class="site-info-value">须臾之间</span>
                    </div>
                    <div class="site-info-item">
                        <span class="site-info-label">描述</span>
                        <span class="site-info-value">寄蜉蝣于天地，渺沧海之一粟。</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="supabase.js"></script>
    <script src="script.js"></script>
</body>
</html>
