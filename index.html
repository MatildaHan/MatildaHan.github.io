<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南山集</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="wrapper">
        <!-- 头部 -->
        <div class="header">
            <div class="header-inner">
                <div class="title-main">南山集</div>
                <div class="title-sub">春山如黛草如烟</div>
            </div>
        </div>

        <div class="container">
            <!-- 左侧菜单 -->
            <div class="sidebar-menu">
                <div class="menu-item active" data-key="xingyin">行吟册·絮</div>
                <div class="menu-item" data-key="shinian">十年灯·文</div>
                <div class="menu-item" data-key="xueye">雪夜舟·图</div>
                <div class="menu-item" data-key="gexidong">各西东·语</div>
                <div class="menu-item" data-key="shanye">山野渔夫</div>
            </div>

            <!-- 右侧内容区 -->
            <div class="content-wrap">
                <!-- 列表视图 -->
                <div class="list-view" id="listView">
                    <div class="content-list" id="contentWrap"></div>
                    <div class="pagination" id="paginationWrap"></div>
                </div>

                <!-- 详情视图 -->
                <div class="detail-view" id="detailView">
                    <div class="article-detail" id="articleDetail"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
