<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>须臾之间 · 后台管理</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="login-container" id="loginContainer">
    <div class="login-logo">须臾之间</div>
    <div class="login-sub">后台管理登录</div>
    <div class="form-group">
        <label>管理员邮箱</label>
        <input type="email" id="login-username" placeholder="请输入登录邮箱" autocomplete="username">
    </div>
    <div class="form-group">
        <label>密码</label>
        <input type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button class="btn-login" id="btnLogin" onclick="handleLogin()">登 录</button>
    <div class="error" id="loginError">邮箱或密码错误</div>
</div>

<div class="admin-wrapper" id="adminWrapper">
    <aside class="admin-sidebar">
        <div class="logo">须臾之间 <span>后台管理</span></div>
        <nav>
            <a href="#" data-panel="panel-dashboard" class="active">总览</a>
            <a href="#" data-panel="panel-suibi">随笔</a>
            <a href="#" data-panel="panel-zaji">杂记</a>
            <a href="#" data-panel="panel-xianhua">闲话</a>
        </nav>
        <div class="footer">© 2026 须臾之间 · v1.0</div>
    </aside>

    <main class="admin-main">
        <div class="admin-header">
            <h2 id="panelTitle">总览</h2>
            <div>
                <span class="user" id="currentUserEmail">管理员</span>
                <span class="logout-btn" onclick="handleLogout()">退出登录</span>
            </div>
        </div>

        <section id="panel-dashboard" class="panel active">
            <div class="form-card">
                <h3>数据概览</h3>
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px;">
                    <div><strong>随笔</strong><br><span id="count-suibi">0</span> 条</div>
                    <div><strong>杂记</strong><br><span id="count-zaji">0</span> 篇</div>
                </div>
            </div>
            <div class="form-card">
                <h3>前端预览</h3>
                <p style="color:#7a6a5a;">所有数据修改后，请刷新前端页面查看效果。</p>
                <p style="margin-top:8px;"><a href="index.html" target="_blank" style="color:#ffffff;text-decoration:underline;">→ 打开前端首页</a></p>
            </div>
        </section>

        <section id="panel-suibi" class="panel">
            <div class="toolbar">
                <button class="btn btn-primary" onclick="openSuibiForm()">+ 新增短句</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>#</th><th>短句内容</th><th>日期</th><th>操作</th></tr></thead>
                    <tbody id="suibi-list"></tbody>
                </table>
            </div>
            <div class="modal-overlay" id="suibiModal">
                <div class="modal-box">
                    <button class="modal-close" onclick="closeSuibiForm()">×</button>
                    <h3 id="suibiModalTitle">编辑短句</h3>
                    <input type="hidden" id="suibi-edit-id">
                    <div class="form-group"><label>短句内容</label><textarea id="suibi-content" rows="2"></textarea></div>
                    <div class="form-group"><label>日期 (YYYY/MM/DD)</label><input type="text" id="suibi-date"></div>
                    <div class="modal-actions">
                        <button class="btn" onclick="closeSuibiForm()">取消</button>
                        <button class="btn btn-primary" onclick="saveSuibi()">保存</button>
                    </div>
                </div>
            </div>
        </section>

        <section id="panel-zaji" class="panel">
            <div class="tab-container">
                <button class="tab-btn active" data-tab="zaji-articles" onclick="switchZajiTab('zaji-articles')">文章列表</button>
                <button class="tab-btn" data-tab="zaji-categories" onclick="switchZajiTab('zaji-categories')">分类管理</button>
            </div>

            <div class="tab-content active" id="zaji-articles">
                <div class="toolbar">
                    <button class="btn btn-primary" onclick="openZajiArticleForm()">+ 新增文章</button>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>#</th><th>标题</th><th>分类</th><th>日期</th><th>操作</th></tr></thead>
                        <tbody id="zaji-list"></tbody>
                    </table>
                </div>
            </div>

            <div class="tab-content" id="zaji-categories">
                <div class="toolbar">
                    <button class="btn btn-primary" onclick="openZajiCategoryForm()">+ 添加分类</button>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>分类名称</th><th>分类描述</th><th>操作</th></tr></thead>
                        <tbody id="zaji-category-list"></tbody>
                    </table>
                </div>
            </div>

            <div class="modal-overlay" id="zajiArticleModal">
                <div class="modal-box">
                    <button class="modal-close" onclick="closeZajiArticleForm()">×</button>
                    <h3 id="zajiArticleModalTitle">编辑文章</h3>
                    <input type="hidden" id="zaji-edit-id">
                    <div class="form-group"><label>标题</label><input type="text" id="zaji-title"></div>
                    <div class="form-group"><label>分类</label><select id="zaji-category-select"></select></div>
                    <div class="form-group"><label>内容</label><textarea id="zaji-content" rows="6"></textarea></div>
                    <div class="form-group"><label>日期</label><input type="text" id="zaji-date"></div>
                    <div class="modal-actions">
                        <button class="btn" onclick="closeZajiArticleForm()">取消</button>
                        <button class="btn btn-primary" onclick="saveZajiArticle()">保存</button>
                    </div>
                </div>
            </div>

            <div class="modal-overlay" id="zajiCategoryModal">
                <div class="modal-box">
                    <button class="modal-close" onclick="closeZajiCategoryForm()">×</button>
                    <h3 id="zajiCategoryModalTitle">编辑分类</h3>
                    <input type="hidden" id="zaji-category-edit-id">
                    <div class="form-group"><label>分类名称</label><input type="text" id="zaji-category-name"></div>
                    <div class="form-group"><label>分类描述</label><textarea id="zaji-category-desc-input" rows="2"></textarea></div>
                    <div class="modal-actions">
                        <button class="btn" onclick="closeZajiCategoryForm()">取消</button>
                        <button class="btn btn-primary" onclick="saveZajiCategory()">保存</button>
                    </div>
                </div>
            </div>
        </section>

        <section id="panel-xianhua" class="panel">
            <div class="form-card">
                <h3>个人简介</h3>
                <div class="form-group">
                    <label>简介内容 (支持多行)</label>
                    <textarea id="xianhua-content" rows="8" style="min-height:200px;"></textarea>
                </div>
                <button class="btn btn-primary" onclick="saveXianhua()">保存简介</button>
            </div>
        </section>
    </main>
</div>

<script src="supabase.js"></script>
<script src="admin.js"></script>
</body>
</html>
